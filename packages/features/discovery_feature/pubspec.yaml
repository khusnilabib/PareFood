name: discovery_feature
description: >-
  PareFood discovery feature: restaurant list nearest-first and restaurant
  detail with menu (FR-DISC-001/004, read-side). Repositories delegate to
  pare_data.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  pare_core:
    path: ../../core
  pare_data:
    path: ../../data
  pare_design:
    path: ../../design
  pare_util:
    path: ../../util

dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter
  test: any

flutter:
  uses-material-design: true
