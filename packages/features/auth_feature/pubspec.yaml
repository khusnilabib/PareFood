name: auth_feature
description: >-
  PareFood authentication feature: sign-in/sign-up flows, session stream and
  auth-gated state (PF-DOC-11 §3.1). Thin UI over pare_data sessions.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  pare_core:
    path: ../../core
  pare_data:
    path: ../../data
  pare_design:
    path: ../../design
  pare_util:
    path: ../../util

dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
