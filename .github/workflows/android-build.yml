name: Android build & sign

# Sprint 1 task 12 (s1-release-setup): produce an installable APK from CI.
# Keystores are NEVER committed (PF-DOC-19, PF-DOC-30). When the keystore
# secret is absent, the workflow builds a debug-signed APK (installable for
# testing) so you get a usable .apk on every run.
#
# Triggers:
#   - push to main (after pr-validation is green) — builds parefood by default
#   - manual dispatch — choose which app(s) to build and release/debug flavor
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build (parefood | parebisnis | paredriver | all)'
        required: true
        default: 'parefood'
        type: choice
        options:
          - parefood
          - parebisnis
          - paredriver
          - all
      build_mode:
        description: 'Build mode (release needs keystore secrets; debug is always installable)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'all' && '["parefood","parebisnis","paredriver"]' || format('["{0}"]', github.event.inputs.app)) || '["parefood"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (FVM)
        uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter-version }}
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Quality gate (format check + analyze)
        run: melos run format && melos run analyze

      - name: Decode signing keystore (only for release mode)
        if: github.event.inputs.build_mode != 'release' || github.event_name != 'workflow_dispatch'
        id: keystore_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Default path on push: use debug build (no keystore needed) so the
          # APK is always installable. On manual dispatch, release mode
          # requires the keystore; debug mode does not.
          MODE="${{ github.event.inputs.build_mode }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$MODE" = "release" ]; then
            if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
              echo "::error::Release mode requires ANDROID_KEYSTORE_BASE64 secret. Re-run with debug mode or add the secret."
              exit 1
            fi
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "Building debug APK (installable for testing, no signing secret required)."
          fi

      - name: Build APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          APP="apps/${{ matrix.app }}"
          MODE="${{ github.event.inputs.build_mode }}"

          # dart-define: pass staging secrets if present, else rely on the
          # dev defaults baked into env.dart (DEP-R06 fallback).
          DEFINES=""
          if [ -n "$STAGING_SUPABASE_URL" ]; then
            DEFINES="$DEFINES --dart-define=SUPABASE_URL=$STAGING_SUPABASE_URL"
          fi
          if [ -n "$STAGING_SUPABASE_ANON_KEY" ]; then
            DEFINES="$DEFINES --dart-define=SUPABASE_ANON_KEY=$STAGING_SUPABASE_ANON_KEY"
          fi
          if [ -n "$DEFINES" ]; then
            DEFINES="$DEFINES --dart-define=PARE_ENV=staging"
          fi

          if [ "${{ steps.keystore_check.outputs.has_keystore }}" = "true" ]; then
            echo "Building RELEASE APK for $APP"
            (cd "$APP" && flutter build apk --release \
              $DEFINES \
              --keystore "$KEYSTORE_PATH" \
              --store-password "$ANDROID_STORE_PASSWORD" \
              --key-password "$ANDROID_KEY_PASSWORD" \
              --keystore-key-alias "$ANDROID_KEY_ALIAS")
          else
            echo "Building DEBUG APK for $APP (signed with the debug key)"
            (cd "$APP" && flutter build apk --debug $DEFINES)
          fi

      - name: Locate built APK
        id: apk
        run: |
          APP="${{ matrix.app }}"
          APK_DIR="apps/$APP/build/app/outputs/flutter-apk"
          echo "Listing APK outputs:"
          ls -lh "$APK_DIR" || true
          APK_PATH=$(find "$APK_DIR" -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
