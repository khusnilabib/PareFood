name: Android build & sign

# Produce installable APKs from CI. Builds all 4 apps in release mode with
# production Supabase config (URL + anon key hardcoded — anon key is public).
# Without a keystore secret, release builds use the debug signing key (still
# installable on any phone for testing).
#
# Triggers:
#   - push to main — builds all 4 apps in release mode
#   - manual dispatch — choose app(s) and build mode
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build (parefood | parebisnis | paredriver | all)'
        required: true
        default: 'all'
        type: choice
        options:
          - parefood
          - parebisnis
          - paredriver
          - all
      build_mode:
        description: 'Build mode (release = production-ready; debug = faster build)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'all' && '["parefood","parebisnis","paredriver"]' || format('["{0}"]', github.event.inputs.app)) || '["parefood","parebisnis","paredriver"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (FVM)
        uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter-version }}
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Quality gate (format check + analyze)
        run: melos run format && melos run analyze

      - name: Decode signing keystore (only when secret is set)
        id: keystore_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Keystore found — will sign with production key."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret — release APK will use debug signing (still installable for testing)."
          fi

      - name: Build APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        run: |
          APP="apps/${{ matrix.app }}"
          MODE="${{ github.event.inputs.build_mode || 'release' }}"

          # Production Supabase config (anon key is public — safe to hardcode).
          # This connects the app to the live PareFood backend.
          SUPABASE_URL="https://mxmmxyagnsnzcrcsfxlh.supabase.co"
          SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14bW14eWFnbnNuemNyY3NmeGxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjY2MDIsImV4cCI6MjEwMTg0MjYwMn0.Q_PrQ7uGD2XE6Mo3oPpjzjlFakM60RwSV3PphpSxHG8"

          DEFINES="--dart-define=PARE_ENV=prod"
          DEFINES="$DEFINES --dart-define=SUPABASE_URL=$SUPABASE_URL"
          DEFINES="$DEFINES --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"

          if [ "$MODE" = "release" ]; then
            echo "Building RELEASE APK for $APP"
            if [ "${{ steps.keystore_check.outputs.has_keystore }}" = "true" ]; then
              (cd "$APP" && flutter build apk --release \
                $DEFINES \
                --keystore "$KEYSTORE_PATH" \
                --store-password "$ANDROID_STORE_PASSWORD" \
                --key-password "$ANDROID_KEY_PASSWORD" \
                --keystore-key-alias "$ANDROID_KEY_ALIAS")
            else
              # Release mode without keystore: Flutter signs with debug key
              # (still installable on any phone for testing).
              (cd "$APP" && flutter build apk --release $DEFINES)
            fi
          else
            echo "Building DEBUG APK for $APP"
            (cd "$APP" && flutter build apk --debug $DEFINES)
          fi

      - name: Locate built APK
        id: apk
        run: |
          APP="${{ matrix.app }}"
          APK_DIR="apps/$APP/build/app/outputs/flutter-apk"
          echo "Listing APK outputs:"
          ls -lh "$APK_DIR" || true
          APK_PATH=$(find "$APK_DIR" -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
