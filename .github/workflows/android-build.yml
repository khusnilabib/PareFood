name: Android build & sign

# Sprint 1 task 12 (s1-release-setup): produce a signed AAB from CI using
# repository secrets. Keystores are NEVER committed (PF-DOC-19, PF-DOC-30).
#
# Triggers:
#   - push to main (after pr-validation is green) — builds parefood by default
#   - manual dispatch — choose which app(s) to build
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build (parefood | parebisnis | paredriver | all)'
        required: true
        default: 'parefood'
        type: choice
        options:
          - parefood
          - parebisnis
          - paredriver
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'all' && '["parefood","parebisnis","paredriver"]' || format('["{0}"]', github.event.inputs.app)) || '["parefood"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (FVM)
        uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter-version }}
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Quality gate (format + analyze)
        run: melos run format && melos run analyze

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set — building unsigned (debug) AAB"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore

      - name: Build signed AAB
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        run: |
          APP="apps/${{ matrix.app }}"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "No keystore — building debug AAB for $APP"
            (cd "$APP" && flutter build aab --debug)
          else
            (cd "$APP" && flutter build aab --release \
              --dart-define=PARE_ENV=staging \
              --dart-define=SUPABASE_URL='${{ secrets.STAGING_SUPABASE_URL }}' \
              --dart-define=SUPABASE_ANON_KEY='${{ secrets.STAGING_SUPABASE_ANON_KEY }}' \
              --keystore "$KEYSTORE_PATH" \
              --store-password "$ANDROID_STORE_PASSWORD" \
              --key-password "$ANDROID_KEY_PASSWORD" \
              --keystore-key-alias "$ANDROID_KEY_ALIAS")
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/build/app/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
