# config-production.toml — PareFood Supabase production config reference.
# This is NOT used by `supabase start` (local); it documents the production
# project settings that must be configured via the Supabase Dashboard or
# applied when creating a production project via `supabase init`.
#
# Differences from the dev config.toml:
# - project_id: parefood-prod
# - site_url: production domain
# - email confirmations: enabled (double opt-in for pilot)
# - rate limits: tighter
# - storage file_size_limit: larger (10MiB for menu images)

project_id = "parefood-prod"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.pooler]
enabled = true
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 200

[realtime]
enabled = true

[studio]
enabled = false  # Studio disabled in production

[inbucket]
enabled = false  # Email preview disabled in production

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "https://parefood.co"
additional_redirect_urls = [
  "https://parefood.co/auth/callback",
  "parefood://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 2
sms_sent = 10  # tighter than dev (30)
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 10  # tighter than dev (30)
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true  # ON in production (pilot)
secure_password_change = true
max_frequency = "1s"

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "Kode PareFood Anda: {{ .Code }}. Berlaku 5 menit."
update_password_template = "Kode reset PareFood Anda: {{ .Code }}."

# Cron jobs are configured via SQL after migration (see migration guide Phase 4)
