name: app_parebisnis
description: >-
  PareBisnis merchant app — Sprint 1 composition root (MO-R06): auth shell,
  restaurant onboarding/status and menu management. Thin wiring over feature
  packages.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
resolution: workspace

dependencies:
  auth_feature:
    path: ../../packages/features/auth_feature
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.4.0
  menu_feature:
    path: ../../packages/features/menu_feature
  merchant_feature:
    path: ../../packages/features/merchant_feature
  pare_core:
    path: ../../packages/core
  pare_data:
    path: ../../packages/data
  pare_design:
    path: ../../packages/design
  profile_feature:
    path: ../../packages/features/profile_feature

dev_dependencies:
  flutter_lints: any
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
